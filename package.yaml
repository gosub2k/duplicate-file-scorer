name:                duplicate-file-scorer
version:             0.1.0.0
github:              "githubuser/duplicate-file-scorer"
license:             BSD3
author:              "Author name here"
maintainer:          "example@example.com"
copyright:           "2025 Author name here"

description:         Duplicate file detection and scoring tools with web UI

dependencies:
- base >= 4.7 && < 5
- optparse-applicative
- text
- regex-tdfa
- time
- unix
- containers
- process
- bytestring
- async
- stm
- directory
- filepath
- wai
- warp
- http-types
- aeson

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: app
  exposed-modules:
  - DuplicateScorer.Scoring
  - DuplicateChecker.Hasher
  - DuplicateChecker.FsType
  - DuplicateChecker.Stats
  - DuplicateChecker.Analyser
  - DuplicateWeb.Server

executables:
  duplicate-file-scorer-exe:
    main: Main.hs
    source-dirs: exe-scorer
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - duplicate-file-scorer

  duplicate-file-spot-checker-exe:
    main: Main.hs
    source-dirs: exe-checker
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - duplicate-file-scorer

  duplicate-dedup-web:
    main: Main.hs
    source-dirs: exe-web
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - duplicate-file-scorer
